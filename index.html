<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F9FF57">
<meta name="description" content="2027 NARUTO × SASUKE ONLY PROJECT / CUSTOM YOUR NARUSASU">
<title>CUSTOM YOUR NARUSASU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&family=Oxanium:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="intro" id="intro" aria-hidden="true"><div class="intro__white"></div></div>

<main class="site" id="site">
  <p class="kicker">2027 NARUTO × SASUKE ONLY PROJECT</p>

  <div class="logo-wrap">
    <h1 class="logo" id="mainLogo" aria-label="CUSTOM YOUR NARUSASU">
      <span class="custom-your">CUSTOM YOUR </span><span class="narusasu"><span class="n">N</span>ARU<span class="s">S</span>ASU</span>
    </h1>
  </div>

  <p class="tagline">好きなナルサスを、好きなかたちで、好きなだけ！</p>

  <section class="next" aria-live="polite" aria-label="Next information release">
    <p class="next__label" id="nextLabel">NEXT INFORMATION</p>
    <p class="next__date" id="nextDate">—</p>
  </section>

  <section class="machine-zone" aria-label="Information gacha">
    <div class="machine" id="machine">
      <div class="chamber">
        <div class="capsule c-yellow c1"></div>
        <div class="capsule c-blue c2"></div>
        <div class="capsule c-clear c3"></div>
        <div class="capsule c-orange c4"></div>
        <div class="capsule c-orange c5"></div>
        <div class="capsule c-blue c6"></div>
        <div class="capsule c-yellow c7"></div>
        <div class="capsule c-clear c8"></div>
        <div class="capsule c-blue c9"></div>
        <div class="capsule capsule-sm c-orange c10"></div>
        <div class="capsule capsule-sm c-clear c11"></div>
        <div class="capsule capsule-md c-yellow c12"></div>
        <div class="capsule capsule-sm c-blue c13"></div>
      </div>
      <div class="machine-body"></div>
      <div class="operation-plate">
        <div class="coin-slot"></div>
        <div class="handle-axis" id="handle"></div>
      </div>
      <div class="delivery-slot"></div>
      <div class="foot"></div>
      <div class="drop-ball" id="dropBall"></div>
    </div>

    <button class="turn-button" id="turnButton" type="button">ハンドルをまわす</button>
  </section>

  <section class="release" aria-label="Released and next information">
    <h2 class="release-title">&gt;&gt; RELEASED / NEXT</h2>
    <div id="releaseList"></div>
  </section>

  <div class="about-entry">
    <button class="about-link" id="aboutButton" type="button">ABOUT / CONTACT</button>
  </div>

  <footer class="footer">
    CUSTOM YOUR NARUSASU
    <span>2027 NARUTO × SASUKE ONLY PROJECT</span>
    <span class="footer-disclaimer">本企画は個人による非公式ファン企画です。<br>原作者・出版社・その他公式関係各社とは一切関係ありません。</span>
  </footer>
</main>

<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true">
  <section class="modal" id="modalPanel">
    <div class="modal-top">
      <div class="modal-kicker" id="modalKicker">RELEASED INFORMATION</div>
      <button class="modal-x" id="modalClose" aria-label="閉じる" type="button">×</button>
    </div>
    <div id="modalContent"></div>
  </section>
</div>

<script src="./releases.js"></script>
<script src="./rally/circles.js"></script>
<script src="./rally/rally.js"></script>
<script src="./about.js"></script>
<script src="./app.js"></script>
</body>
</html>
