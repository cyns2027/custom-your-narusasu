<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f4ee">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
<title>NARUSASUお題ガチャ</title>
<meta property="og:title" content="NARUSASUお題ガチャ">
<meta property="og:description" content="好きなお題が出るまで何度でも回せます。漫画・小説・イラスト・コスプレ・萌え語りなど、ご自由にどうぞ！">
<meta property="og:type" content="website">
<style>
:root{--bg:#f4f4f1;--ink:#171717;--muted:#777;--line:#d8d3ca;--card:#ffffff;--orange:#f69500;--blue:#012a91}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Source Han Sans JP","Hiragino Sans","Yu Gothic",sans-serif;display:grid;place-items:center;padding:28px 18px;font-weight:900}
main{width:min(720px,100%);text-align:center}
.eyebrow{font-size:11px;letter-spacing:.22em;margin-bottom:10px}
h1{font-size:clamp(28px,7vw,52px);line-height:1;margin:0 0 10px;letter-spacing:.02em;font-weight:900}
.intro{color:var(--muted);line-height:1.8;margin:0 auto 28px;font-weight:900}
.intro-main{display:block;font-size:12px;margin-top:16px}
.intro-sub{display:block;font-size:12px;margin-top:2px}
.machine{border:1px solid var(--ink);border-radius:24px;padding:18px;background:var(--card);box-shadow:8px 8px 0 var(--ink)}
.slot{min-height:82px;border:1px solid var(--line);border-radius:14px;display:grid;place-items:center;padding:12px 10px;background:white;font-size:clamp(20px,5vw,31px);font-weight:900;line-height:1.35}
.x{font-family:Georgia,serif;font-style:italic;font-size:24px;padding:6px 0}
.actions{display:grid;gap:10px;margin-top:20px}
button,a.share{appearance:none;border:1px solid var(--ink);border-radius:999px;padding:15px 18px;font:inherit;font-weight:900;cursor:pointer;text-decoration:none;color:var(--ink);background:transparent}
#spin{background:var(--ink);color:var(--bg);font-size:17px}
.shares{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{margin-top:22px;font-size:11px;color:var(--muted);line-height:1.8}
.credit{
  margin-top:22px;
  font-size:9px;
  line-height:1.7;
  color:var(--muted);
  text-align:center;
  letter-spacing:.06em;
}
.credit strong{
  display:block;
  color:var(--ink);
  font-weight:700;
}
.credit .url{
  display:block;
  word-break:break-all;
}
.logo-n{color:var(--orange)}
.logo-s{color:var(--blue)}
.flash{animation:pop .22s ease}
@keyframes pop{0%{transform:scale(.96);opacity:.45}100%{transform:scale(1);opacity:1}}
@media(max-width:430px){.machine{box-shadow:5px 5px 0 var(--ink)}.shares{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h1><span class="logo-n">N</span>ARU<span class="logo-s">S</span>ASU お題ガチャ</h1>
  <p class="intro"><span class="intro-main">好きなお題が出るまで何度でも回せます。</span><span class="intro-sub">漫画・小説・イラスト・コスプレ・萌え語りなど、ご自由にどうぞ！</span></p>

  <section class="machine" aria-live="polite">
    <div class="slot" id="scene">深夜</div>
    <div class="x">×</div>
    <div class="slot" id="condition">ふたりきり</div>
    <div class="x">×</div>
    <div class="slot" id="keyword">約束</div>
  </section>

  <div class="actions">
    <button id="spin">ガチャをまわす</button>
    <div class="shares">
      <a class="share" id="shareX" target="_blank" rel="noopener">Xでシェア</a>
      <a class="share" id="shareBsky" target="_blank" rel="noopener">Blueskyでシェア</a>
    </div>
  </div>
  <p class="note">※ナルサス限定でご利用ください！</p>
  <div class="credit">
    <strong>2027 NARUSASU ONLY PROJECT</strong>
<a class="url" href="https://cyns2027.github.io/custom-your-narusasu/">
  CUSTOM YOUR NARUSASU
</a>
  </div>
</main>

  return `━━━ ∙ʚ NARUSASUお題ガチャɞ∙ ━━━

  $("shareX").href = "https://twitter.com/intent/tweet?text="+encodeURIComponent(text);
  $("shareBsky").href = "https://bsky.app/intent/compose?text="+encodeURIComponent(text);

function spin(){
  [["scene",scenes],["condition",conditions],["keyword",keywords]].forEach(([id,a])=>{
    const el=$(id); el.textContent=pick(a); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");

}
$("spin").addEventListener("click",spin);

</body>
</html>
